[package]
name = "nu_plugin_zip"
version = "0.1.0"
edition = "2021"
# The nu-* crates set the floor, and it rises with each Nushell minor: 1.93.1
# for 0.113, 1.95.0 for 0.114 and 0.115, 1.96.1 for 0.116. Declared as the
# highest across supported-nu.txt, so every variant — the one on crates.io
# included — says so plainly instead of failing deep inside a dependency. Raise
# it when a newer minor is added.
rust-version = "1.96.1"
description = "Browse zip archives from Nushell like folders — ls, glob and open inside a zip, in memory, never touching disk."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ChristianLemer/nu_plugin_zip"
keywords = ["nushell", "plugin", "zip", "archive"]
categories = ["command-line-utilities", "compression"]
# What a `cargo install` user needs is the source, the manifest, the licence and
# the two documents that explain the thing. The rest is how this repository is
# run, and shipping it to every installer is noise.
exclude = [
  ".github/",
  ".coderabbit.yaml",
  ".gitignore",
  "AGENTS.md",
  "orca.yaml",
  "scripts/",
  "tests/fixtures/",
  "*.code-workspace",
]

[dependencies]
nu-plugin = "0.113.0"
nu-protocol = { version = "0.113.0", features = ["plugin"] }
chrono = "0.4"
# Pure-Rust decompressors only: the tree must carry no C library, or the static
# musl builds and the bare `cargo build` promised in AGENTS.md both break.
# zstd, bzip2 and lzma members are reported as unsupported, not linked in.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "chrono"] }
globset = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
